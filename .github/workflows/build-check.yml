name: build-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  multiplatform:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    - uses: actions/cache@v4
      with:
        key: env-files-win-laz
        path: tool/data
    - run: pip install -r requirements.txt
    - run: .\build.bat setup
    - run: .\build.bat check
